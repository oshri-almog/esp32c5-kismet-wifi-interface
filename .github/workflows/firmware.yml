# Builds the board firmware in firmware/ and the browser flasher in web/, and publishes them:
#   pull requests       build both and upload them as artifacts ("firmware", "site"); nothing more
#   push to main        the same, then deploy the site to GitHub Pages
#   manual run on main  the same as a push to main (a manual run on another branch only builds)
#   version tag         build, then attach the merged image and its .sha256 to the tag's GitHub
#                       Release, creating the release if there is none. Tags deploy no site: the
#                       flasher always installs the build from main.
# Pushes to main and pull requests run only when a file under "paths" below changed. GitHub does not
# apply path filters to tag pushes, so a version tag always runs. A tag on a commit without this
# file starts no run, so its release gets no image; to retry a release whose upload failed, re-run
# the failed job (a manual run on a tag only builds, as a rebuild would not match the release).
#
# The firmware is built with ESP-IDF v5.5.5 in Espressif's image, the version that built the image
# the boards were tested with, and the merged image is made as the wiki's Flashing-the-Firmware
# page ("Make the merged image") describes. firmware/CMakeLists.txt sets no version, so ESP-IDF
# takes the App version from git describe: the checkout needs the full history and the tags.
#
# Asset names: esp32c5-kismet-<version>-merged.bin and .sha256, where <version> is the tag for a
# release and git describe (the App version) otherwise. On the site the image is always
# firmware/esp32c5-kismet-merged.bin; the manifest's "version", the page's version, commit and
# SHA-256, and the ?sha256= cache key on the manifest's and the image's URLs are filled in from
# @...@ placeholders.
#
# The Pages site must be set to "GitHub Actions" as its source (Settings, Pages) before the first
# deploy, or actions/configure-pages stops with an error.
#
# Actions are pinned to commit SHAs (the version is in the comment); .github/dependabot.yml keeps
# them current. The ESP-IDF image is pinned by digest, which Dependabot does not update: change
# the tag and the digest together, on purpose.

name: Firmware and web flasher

on:
  push:
    branches: [main]
    # The same version tags as docker.yml
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
    paths:
      - "firmware/**"
      - "web/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "web/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch or tag. Pages deploys from main then go out in push order: without
# this, an older run whose build finished last would deploy over the newer site. A waiting run is
# replaced by a newer one on the same ref, which builds the newer commit anyway. On a pull request
# a new push also cancels the run in progress.
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # bash -eo pipefail, so a failing command in a pipe fails the step
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # v5.5.5 (linux/amd64 and linux/arm64)
      image: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    permissions:
      contents: read
    steps:
      # fetch-depth 0 brings every commit and tag, which git describe needs for the App version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The container runs as root and the checkout belongs to the runner's user, so git refuses
      # the repository as "dubious ownership". ESP-IDF's git describe would then fail without a
      # word, and the App version would read "1".
      - name: Let git use the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Steps run through docker exec, not the image's entrypoint, so ESP-IDF's environment is
      # set up here. set-target on a fresh checkout makes the sdkconfig from sdkconfig.defaults.
      - name: Build the firmware and the merged image
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py set-target esp32c5
          idf.py build
          idf.py merge-bin -o esp32c5-kismet-merged.bin
          idf.py --version | tee build/idf-version.txt

      # The version is read back from the build, so it is the App version the board reports. It
      # must match git describe as ESP-IDF runs it: if ESP-IDF could not run git, it says "1".
      # A -dirty version means the checkout had changes, which a build here never should. Only
      # plain characters are let through, as the version goes into file names, sed, JSON and HTML.
      - name: Version, release files and site
        run: |
          image=firmware/build/esp32c5-kismet-merged.bin
          version=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["project_version"])' firmware/build/project_description.json)
          described=$(git describe --always --tags --dirty)
          idf_version=$(sed -n 's/^ESP-IDF //p' firmware/build/idf-version.txt)
          commit=$(git rev-parse HEAD)
          sha256=$(sha256sum "$image" | cut -d ' ' -f 1)
          size=$(stat -c %s "$image")
          size_text=$(python3 -c 'import sys; print(f"{int(sys.argv[1]):,}")' "$size")
          echo "App version: $version, ESP-IDF $idf_version, commit $commit"
          echo "$image: $size bytes, SHA-256 $sha256"
          if [ "$version" != "$described" ]; then
            echo "::error::The App version is '$version', but git describe gives '$described'"
            exit 1
          fi
          case $version in
            *-dirty) echo "::error::The checkout had changes: $(git status --short --untracked-files=no | tr '\n' ' ')"; exit 1 ;;
          esac

          # A release is named after its tag. git describe gives the same name unless another
          # tag points at the same commit.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            asset_version=$GITHUB_REF_NAME
            if [ "$version" != "$asset_version" ]; then
              echo "::warning::The firmware's App version is $version, not the tag $asset_version"
            fi
          else
            asset_version=$version
          fi
          for v in "$version" "$asset_version" "$idf_version"; do
            case $v in
              "" | *[!A-Za-z0-9._+-]*) echo "::error::Unexpected version string: '$v'"; exit 1 ;;
            esac
          done

          name="esp32c5-kismet-$asset_version-merged.bin"
          mkdir -p dist/release
          cp "$image" "dist/release/$name"
          (cd dist/release && sha256sum "$name" > "$name.sha256")

          mkdir -p dist/site/firmware
          cp -R web/. dist/site/
          cp "$image" dist/site/firmware/esp32c5-kismet-merged.bin
          (cd dist/site/firmware && sha256sum esp32c5-kismet-merged.bin > esp32c5-kismet-merged.bin.sha256)
          sed -i \
            -e "s|@VERSION@|$version|g" \
            -e "s|@COMMIT@|$commit|g" \
            -e "s|@COMMIT_SHORT@|${commit:0:7}|g" \
            -e "s|@SHA256@|$sha256|g" \
            -e "s|@SIZE@|$size_text|g" \
            -e "s|@IDF_VERSION@|$idf_version|g" \
            dist/site/index.html dist/site/manifest.json
          if grep -n '@[A-Z][A-Z0-9_]*@' dist/site/index.html dist/site/manifest.json; then
            echo "::error::A placeholder above was not filled in"
            exit 1
          fi
          python3 -m json.tool dist/site/manifest.json > /dev/null

          {
            echo "### Firmware $version"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Release file | \`$name\` |"
            echo "| Size | $size_text bytes |"
            echo "| SHA-256 | \`$sha256\` |"
            echo "| Commit | \`$commit\` |"
            echo "| ESP-IDF | $idf_version |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware
          path: dist/release/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist/site/
          if-no-files-found: error

  # Only from main: the github-pages environment accepts the default branch, and the site is
  # what users flash, so it never comes from a pull request or a tag. Deploys never overlap or go
  # out of order, because runs on main take turns (the workflow's concurrency group).
  pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firmware
          path: release

      # The tag comes in through the environment, not pasted into the script: a tag name may
      # contain quotes. A new release is made as a draft and published only once its files are on
      # it, because a published release takes no more files if the repository turns on immutable
      # releases. A release that exists already (one written by hand, or a draft left by a failed
      # run) keeps its notes; only the files are replaced, and a draft is then published.
      - name: Attach the image to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            pages="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
            wiki="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/wiki"
            cat > "$RUNNER_TEMP/notes.md" <<EOF
          Firmware for ESP32-C5 boards, built from $TAG by the Firmware and web flasher workflow.

          - **From the browser:** the [web flasher]($pages), in Chrome or Edge 89 or newer on a computer. It installs the latest build from main.
          - **With esptool:** flash \`esp32c5-kismet-$TAG-merged.bin\` at offset \`0x0\`, for example \`python -m esptool --chip esp32c5 -p COM14 write_flash 0x0 esp32c5-kismet-$TAG-merged.bin\`. The \`.sha256\` file holds its checksum.
          - A board last used for Zigbee or Thread can come up deaf to Wi-Fi after any flash: run a Wi-Fi source on it first. [Flashing the Firmware]($wiki/Flashing-the-Firmware) in the wiki has this, backups and how to check the result.
          EOF
            prerelease=()
            case $TAG in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
          fi
          if ! gh release upload "$TAG" release/* --clobber; then
            echo "::error::Could not attach the files to the release $TAG. With immutable releases turned on, a published release takes no more files: let this workflow create the release, as a draft that it publishes after the upload, rather than publishing one by hand first."
            exit 1
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --draft=false
          fi
          gh release view "$TAG"
