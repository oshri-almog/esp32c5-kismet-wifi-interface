# Kismet settings for the container. Loaded after every other Kismet config file, so anything here
# wins. To change more, mount your own file over /etc/kismet/kismet_site.conf, and keep the lines
# below in it. See https://github.com/oshri-almog/esp32c5-kismet-wifi-interface/wiki/Docker-Reference

# Logs go to the /data volume instead of the working directory of the moment
log_prefix=/data/

# Remote capture: the helpers connect over the websocket on the web port (2501), which needs a login
# or an API key. Kismet's older TCP remote capture (port 3501) has no authentication at all, so it
# stays on its default, loopback only, which inside a container means unreachable from outside it.
# Only a helper started with --tcp uses it (kismet_cap_esp32c5 and the Python remote helper both
# have the option); to use it anyway, set remote_capture_listen=0.0.0.0 in your own copy of this
# file and publish 3501 on a network you trust.

# Kismet's other capture helpers, which the image has too, are masked: Kismet does not start them to
# list interfaces or to probe a source given without type=, as the entrypoint's sources are. They
# keep NET_ADMIN and NET_RAW (Kismet's cf_drop_most_caps), which the container does not have, and
# without NET_ADMIN they crash (SIGSEGV) as soon as they start. kismet_cap_esp32c5 is not one of
# them: it drops every capability itself and needs none, which is why the image needs no --cap-add.
# The web UI's Data Sources window asks every helper for its interfaces and waits for them all, so
# one that crashed means the list, and every board in it, never comes.
# A masked type still works with type= in its source (wlan0:type=linuxwifi), in a container given
# NET_ADMIN (cap_add: [NET_ADMIN] on the service in a compose.override.yaml, or docker run
# --cap-add NET_ADMIN) and the hardware it is for. A file of your own mounted over this one should
# keep these lines.
# Not masked: pcapfile, kismetdb and sniffle_ble, which start without NET_ADMIN (pcapfile and
# kismetdb find a "-c /data/capture.pcapng" by themselves), and the helpers the image does not
# build (SDRs, Ubertooth, bladeRF...), which Kismet skips at once. The names are Kismet's type names
# (/datasource/types.json), matched exactly. tests/docker_smoke.sh fails "interface list answers"
# when a KISMET_REF change brings in a helper that crashes the same way: add its type here.
mask_datasource_type=linuxwifi
mask_datasource_type=linuxbluetooth
mask_datasource_type=nrfmousejack
mask_datasource_type=radiacode-usb
mask_datasource_type=rzkillerbee
mask_datasource_type=ticc2531
mask_datasource_type=ticc2540
mask_datasource_type=wch-ble-pro
# and the ones Kismet only probes, which crash on every source given without type=
mask_datasource_type=antsdr-droneid
mask_datasource_type=catsniffer_zigbee
mask_datasource_type=freaklabszigbee
mask_datasource_type=nrf51822
mask_datasource_type=nrf52840
mask_datasource_type=nxp_kw41z
mask_datasource_type=radview
